name: ci

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ccache (CMakeLists.txt) keeps each job's objects between runs: a run restores the newest cache of its job and saves
# its own, so a commit that leaves a file, its headers and its flags as they were does not compile it again.
env:
  CCACHE_MAXSIZE: 1G

jobs:
  gcc:
    runs-on: ubuntu-latest
    container: gcc:16
    env:
      CPM_SOURCE_CACHE: /__w/.cpm
      CCACHE_DIR: /__w/.ccache
    steps:
      - run: apt-get update && apt-get install -y cmake ninja-build ccache
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: /__w/.cpm
          key: cpm-gcc-${{ hashFiles('tests/CMakeLists.txt') }}
      - uses: actions/cache@v4
        with:
          path: /__w/.ccache
          key: ccache-gcc-${{ github.sha }}
          restore-keys: ccache-gcc-
      - run: cmake --preset gcc
      - run: ccache --zero-stats && cmake --build --preset gcc && ccache --show-stats
      - run: ctest --preset gcc

  clang:
    runs-on: ubuntu-26.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .cpm
          key: cpm-clang-${{ hashFiles('tests/CMakeLists.txt') }}
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-clang-${{ github.sha }}
          restore-keys: ccache-clang-
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache clang-22 libc++-22-dev libc++abi-22-dev
      - run: >
          cmake --preset clang -DCMAKE_CXX_COMPILER=clang++-22
          -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
      - run: ccache --zero-stats && cmake --build --preset clang && ccache --show-stats
      - run: ctest --preset clang

  windows:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        compiler: [cl, clang-cl]
    env:
      CPM_SOURCE_CACHE: 'C:\cpm' # short on purpose: long paths lose files silently (MAX_PATH)
      CCACHE_DIR: 'C:\ccache'
      CCACHE_VERSION: '4.14.2'
      CCACHE_SHA256: 6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: 'C:\cpm'
          key: cpm-windows-${{ hashFiles('tests/CMakeLists.txt') }}
      - uses: actions/cache@v4
        with:
          path: 'C:\ccache'
          key: ccache-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-
      - name: Install ccache
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          Invoke-WebRequest -OutFile $zip -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/ccache-$env:CCACHE_VERSION-windows-x86_64.zip"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:CCACHE_SHA256) { throw "ccache: checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\ccache-$env:CCACHE_VERSION-windows-x86_64" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - run: cmake --preset ${{ matrix.compiler }}
      - run: ccache --zero-stats; cmake --build --preset ${{ matrix.compiler }}; if ($?) { ccache --show-stats }
      - run: ctest --preset ${{ matrix.compiler }}

  # The user manual (docs/sphinx): Doxygen's XML, then Sphinx through uv, the site and the PDF's LaTeX source,
  # failing on any warning or check. The PDF itself is compiled locally (numerixx_docs_pdf): no TeX here.
  docs:
    runs-on: ubuntu-26.04
    env:
      DOXYGEN_VERSION: '1.18.0'
      DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.5'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: |
          curl -sSL -o doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "$DOXYGEN_SHA256  doxygen.tar.gz" | sha256sum -c -
          tar xzf doxygen.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION/bin" >> "$GITHUB_PATH"
      - run: >
          cmake --preset gcc -DNUMERIXX_BUILD_TESTS=OFF -DNUMERIXX_BUILD_DEMOS=OFF -DNUMERIXX_BUILD_BOOK=OFF
      - run: cmake --build --preset gcc --target numerixx_docs

  emscripten:
    runs-on: ubuntu-26.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      EMSDK_VERSION: '6.0.10'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .cpm
          key: cpm-emscripten-${{ hashFiles('tests/CMakeLists.txt') }}
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-emscripten-${{ github.sha }}
          restore-keys: ccache-emscripten-
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - run: |
          source ~/emsdk/emsdk_env.sh
          cmake --preset emscripten
          ccache --zero-stats
          cmake --build --preset emscripten
          ccache --show-stats
          ctest --preset emscripten
